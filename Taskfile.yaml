version: '3'

dotenv: ['.env']

env:
  EGO_DEBUG: "true"
  SCRIPT_TEMP_DIR: "{{.ROOT_DIR}}/app"
  PATH: "{{.HOME}}/go/bin:{{.PATH}}"

tasks:
  default:
    desc: "命令提示"
    cmds:
      - task --list-all

  # --- 运行模式命令 ---

  run:
    desc: "启动服务 (默认全量模式: Scheduler + Agent + Executor)"
    cmds:
      - go run main.go server --mode all --config ./config/config.yaml

  scheduler:
    desc: "启动调度器 (仅包含 Scheduler 逻辑)"
    cmds:
      - go run main.go server --mode scheduler --config ./config/config.yaml

  agent:
    desc: "启动异步执行代理 (仅基于 Kafka 的 Agent)"
    cmds:
      - go run main.go server --mode agent --config ./config/config.yaml

  executor:
    desc: "启动原生执行器 (仅基于 gRPC 的 Executor)"
    cmds:
      - go run main.go server --mode executor --config ./config/config.yaml

  # --- 代码与契约生成 ---

  gen:
    desc: "全量代码生成 (Wire + Proto + Perm)"
    cmds:
      - task: wire
      - task: proto
      - task: perm

  wire:
    desc: "依赖注入代码生成"
    cmds:
      - wire ./ioc

  proto:
    desc: "代码生成 (Protobuf)"
    cmds:
      - buf generate api/proto

  perm:
    desc: "权限 AST 静态扫描与强类型契约生成"
    cmds:
      - permgen -s ./internal/web

  swagger:
    desc: "生成 OpenAPI 3.0 / Swagger 接口文档与交互页面"
    cmds:
      - swaggergen -s ./internal/web -o ./api/docs/swagger.json --html ./api/docs/index.html -t "ETask API Documentation"

  mocks:
    desc: "测试 Mock 代码生成"
    cmds:
      - go generate ./internal/... ./pkg/tasklog

  # --- 数据库迁移 ---

  migrate:up:
    desc: "执行所有待执行的数据库迁移（DSN 从 .env 读取）"
    cmds:
      - goose -dir deploy/migrations up

  migrate:status:
    desc: "查看数据库迁移状态"
    cmds:
      - goose -dir deploy/migrations status

  migrate:down:
    desc: "回滚最近一次数据库迁移"
    cmds:
      - goose -dir deploy/migrations down

  migrate:create:
    desc: "创建新的迁移文件（用法：task migrate:create NAME=add_new_table）"
    cmds:
      - goose -dir deploy/migrations -s create {{.NAME}} sql

  # --- 工具链安装 ---

  install:tools:
    desc: "安装生态通用工具链 (wire, permgen, swaggergen, goose, buf)"
    cmds:
      - go install github.com/google/wire/cmd/wire@latest
      - go install github.com/Duke1616/eiam/cmd/permgen@latest
      - go install github.com/Duke1616/eiam/cmd/swaggergen@latest
      - go install github.com/pressly/goose/v3/cmd/goose@latest
